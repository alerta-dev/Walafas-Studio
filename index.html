<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creador de Walfas</title>
<style>
:root{--bg:#f4eef7;--panel:#fff;--ink:#2a2233;--mut:#7b6f88;--acc:#c0407a;--line:#e0d6e8}
@media (prefers-color-scheme:dark){:root{--bg:#1b1622;--panel:#262031;--ink:#efe9f5;--mut:#a597b5;--acc:#e0609a;--line:#3a3148}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:1}
main{display:grid;grid-template-columns:minmax(300px,560px) minmax(300px,1fr);gap:12px;padding:0 12px 16px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
#wrap{width:100%;aspect-ratio:550/400;position:relative;border-radius:8px;overflow:hidden;background:#fff;touch-action:none}
#stage{width:100%;height:100%;display:block}
.hc{fill:var(--hair,#888)}.hs{stroke:var(--hair,#888)}
.ent{cursor:grab}.sel .selbox{display:block}.selbox{display:none;fill:none;stroke:#e0408a;stroke-width:1.5;stroke-dasharray:5 3;pointer-events:none}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--acc)}button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 7px;color:inherit}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row label{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px;max-height:340px;overflow:auto;padding:2px}
.th{aspect-ratio:1;border:2px solid var(--line);border-radius:8px;background:#fff;padding:2px;cursor:pointer;position:relative;overflow:hidden}
.th.cur{border-color:var(--acc)}.th svg{width:100%;height:100%;display:block}
.th i{position:absolute;left:0;right:0;bottom:0;font:9px/1.2 system-ui;background:#000a;color:#fff;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal}
.th.none{display:flex;align-items:center;justify-content:center;color:#999;font-size:12px}
textarea{width:100%;height:54px;font:12px monospace;resize:vertical}
small{color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>Creador de Walfas <small>· recreación web</small></h1>
  <button id="snd" title="Sonido">🔊</button>
</header>
<main>
  <section class="card">
    <div id="wrap"><svg id="stage" viewBox="0 0 550 400" xmlns="http://www.w3.org/2000/svg">
      <defs><clipPath id="sclip"><rect width="550" height="400"/></clipPath></defs>
      <g clip-path="url(#sclip)"><g id="bg"></g><g id="ents"></g></g>
    </svg></div>
    <div class="row">
      <button id="bNew">＋ Personaje</button><button id="bRand">🎲 Aleatorio</button><button id="bClone">Clonar</button><button id="bDel">Borrar</button>
      <button id="bFH">↔ Voltear</button><button id="bFV">↕ Voltear</button><button id="bFront">Al frente</button><button id="bBack">Al fondo</button>
    </div>
    <div class="row">
      <label>Tamaño <input id="rScale" type="range" min="10" max="400" value="100"></label>
      <label>Rotación <input id="rRot" type="range" min="-180" max="180" value="0"></label>
    </div>
    <div class="row">
      <button id="bPng">💾 Guardar PNG</button><button id="bClear">Vaciar escena</button>
      <small id="info"></small>
    </div>
  </section>
  <section class="card">
    <div class="tabs" id="mainTabs"></div>
    <div id="tChar">
      <div class="row"><label>Nombre <input id="iName" type="text" size="14"></label>
        <label>Preset <select id="sPreset"></select></label></div>
      <div class="row"><label>Color de pelo <input id="cHair" type="color"></label>
        <label><input id="kLock" type="checkbox"> Bloquear esta categoría al azar</label></div>
      <div class="tabs" id="catTabs"></div>
      <div class="grid" id="grid"></div>
      <div class="row"><label>DNA</label></div>
      <textarea id="dna" spellcheck="false"></textarea>
      <div class="row"><button id="bDnaCopy">Copiar DNA</button><button id="bDnaLoad">Crear desde DNA</button><small id="dnaMsg"></small></div>
    </div>
    <div id="tBg" hidden><div class="grid" id="gridBg"></div></div>
    <div id="tObj" hidden><div class="grid" id="gridObj"></div></div>
  </section>
</main>
<script>
"use strict";
const NS='http://www.w3.org/2000/svg', $=s=>document.querySelector(s);
const CATS=[['Hair','Pelo'],['Body','Cuerpo'],['Arms','Brazos'],['Shoes','Piernas'],['Eyes','Ojos'],['Mouth','Boca'],['Hats','Sombrero'],['Items','Objeto'],['Acc','Accesorio'],['Back','Alas/Espalda']];
const KEY={Hats:'hat',Hair:'head',Body:'body',Arms:'arm',Shoes:'shoe',Eyes:'eye',Mouth:'mouth',Items:'item',Acc:'acc',Back:'wing'};
const DNAORDER=['Hats','Hair','Body','Arms','Shoes','Eyes','Mouth','Items','Acc','Back'];
let D, libs={}, ents=[], sel=null, curCat='Hair', locks={}, muted=false, uid=0;
const defsSvg=document.body.appendChild(Object.assign(document.createElementNS(NS,'svg'),{style:'position:absolute;width:0;height:0'}));
const defsEl=defsSvg.appendChild(document.createElementNS(NS,'defs'));

function sfx(n){ if(muted) return; try{const a=new Audio('sounds/'+n+'.mp3');a.volume=.5;a.play().catch(()=>{});}catch(e){} }
async function lib(name){
  if(libs[name]) return libs[name];
  return libs[name]=fetch('parts/'+name+'.svg').then(r=>r.text()).then(t=>{
    const doc=new DOMParser().parseFromString(t,'image/svg+xml'), m={};
    doc.querySelectorAll('defs > *').forEach(n=>defsEl.appendChild(document.importNode(n,true)));
    doc.documentElement.querySelectorAll(':scope > g[id^=f]').forEach(g=>m[+g.id.slice(1)]=document.importNode(g,true));
    libs[name]=m; return m;
  });
}
const L=n=>libs[n]&&typeof libs[n].then!=='function'?libs[n]:null;
function cloneFrame(name,f,into){ const m=L(name); if(m&&m[f]) for(const c of m[f].childNodes) into.appendChild(c.cloneNode(true)); }
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
const mtx=m=>`matrix(${m.join(' ')})`;
const part=(cat,i)=>D.parts[cat][i];

/* ---------- personajes ---------- */
function newCharData(o={}){
  const c={kind:'char',name:'Char'+(++uid),scale:100,x:275,y:250,rot:0,fx:1,fy:1,color:'888888',idx:{}};
  for(const [cat] of CATS) c.idx[cat]=0;
  return Object.assign(c,o);
}
function randomIdx(c){
  for(const [cat] of CATS){ if(locks[cat]) continue; c.idx[cat]=Math.floor(Math.random()*D.parts[cat].length); }
  if(!locks.Hair) c.color=D.parts.Hair[c.idx.Hair][6];
}
function applyPreset(c,name){
  const p=D.presets[name]; if(!p) return;
  for(const cat in KEY) c.idx[cat]=p[KEY[cat]]||0;
  c.color=D.parts.Hair[c.idx.Hair][6]; c.name=name;
}
async function ensureCharLibs(c){
  const need=new Set();
  for(const [cat] of CATS){ const p=part(cat,c.idx[cat]); if(p!=='none') need.add(cat); }
  need.add('Eye2'); need.add('Hair2');
  await Promise.all([...need].map(n=>lib(n)));
}
function buildChar(c){
  const g=c.g; while(g.firstChild) g.removeChild(g.firstChild);
  g.setAttribute('transform',`translate(${c.x} ${c.y}) rotate(${c.rot}) scale(${c.fx*c.scale/100} ${c.fy*c.scale/100})`);
  g.style.setProperty('--hair','#'+c.color);
  const inner=el('g',{transform:'scale(0.05)'},g);
  for(const ly of D.layers){
    const cat=ly.lib==='Hair2'?'Hair':ly.lib; const p=part(cat,c.idx[cat]); if(p==='none') continue;
    let frame=p[1], name=ly.lib;
    if(ly.lib==='Hair2'){ frame=p[5]; if(!(frame>0)) continue; }
    const lg=el('g',{transform:mtx(ly.m)},inner); cloneFrame(name,frame,lg);
    if(ly.lib==='Hair'){
      const e=part('Eyes',c.idx.Eyes); const e2=e!=='none'&&e[5]>0?e[5]:0;
      lg.querySelectorAll('.e2').forEach(ph=>{ if(e2) cloneFrame('Eye2',e2,ph); });
    }
  }
  const bb=inner.getBBox(); const s=.05;
  c.box=el('rect',{class:'selbox',x:bb.x*s-4,y:bb.y*s-4,width:bb.width*s+8,height:bb.height*s+8},g);
  c.bbox=[bb.x*s,bb.y*s,bb.width*s,bb.height*s];
}
async function refresh(c){ if(c.kind==='char'){ await ensureCharLibs(c); buildChar(c);} else buildObj(c); }
function mkEnt(c){
  c.g=el('g',{class:'ent'},$('#ents')); c.g.addEventListener('pointerdown',e=>startDrag(e,c)); ents.push(c); return c;
}
async function addChar(o,select=true){ const c=mkEnt(newCharData(o)); await refresh(c); if(select) pick(c); return c; }

/* ---------- objetos ---------- */
async function addObj(frame,name){
  const c=mkEnt({kind:'obj',name,frame,scale:100,x:275,y:200,rot:0,fx:1,fy:1}); await refresh(c); pick(c);
}
async function buildObj(c){
  await lib('Objects'); const g=c.g; while(g.firstChild) g.removeChild(g.firstChild);
  g.setAttribute('transform',`translate(${c.x} ${c.y}) rotate(${c.rot}) scale(${c.fx*c.scale/100} ${c.fy*c.scale/100})`);
  const inner=el('g',{transform:'scale(0.05)'},g); cloneFrame('Objects',c.frame,inner);
  const bb=inner.getBBox(),s=.05; c.box=el('rect',{class:'selbox',x:bb.x*s-4,y:bb.y*s-4,width:bb.width*s+8,height:bb.height*s+8},g);
}
function transformOnly(c){ c.g.setAttribute('transform',`translate(${c.x} ${c.y}) rotate(${c.rot}) scale(${c.fx*c.scale/100} ${c.fy*c.scale/100})`); }

/* ---------- selección / arrastre ---------- */
function pick(c){
  sel=c; ents.forEach(e=>e.g.classList.toggle('sel',e===c));
  if(c){ $('#rScale').value=c.scale; $('#rRot').value=c.rot; }
  syncUI();
}
let drag=null;
function pt(e){ const s=$('#stage'),p=s.createSVGPoint(); p.x=e.clientX;p.y=e.clientY; return p.matrixTransform(s.getScreenCTM().inverse()); }
function startDrag(e,c){ e.preventDefault(); e.stopPropagation(); pick(c); const p=pt(e); drag={c,dx:c.x-p.x,dy:c.y-p.y}; c.g.setPointerCapture?.(e.pointerId); sfx('MenuSelect'); }
addEventListener('pointermove',e=>{ if(!drag) return; const p=pt(e); drag.c.x=p.x+drag.dx; drag.c.y=p.y+drag.dy; transformOnly(drag.c); });
addEventListener('pointerup',()=>{ if(drag){drag=null;save();} });
$('#stage').addEventListener('pointerdown',()=>pick(null));
addEventListener('keydown',e=>{ if(e.key==='Delete'&&sel&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)) del(); });
function del(){ if(!sel) return; sel.g.remove(); ents=ents.filter(e=>e!==sel); pick(ents[ents.length-1]||null); save(); }

/* ---------- DNA ---------- */
function getDNA(c){ return [D.version,c.name,c.scale,...DNAORDER.map(k=>c.idx[k]),c.color.toUpperCase()].join(':'); }
// orden original: ver:nombre:escala:hat:head:body:arm:shoe:eye:mouth:item:acc:wing:color
function parseDNA(t){
  t=t.trim().replace(/^dna-/i,''); const a=t.split(':'); if(a.length<13) throw new Error('DNA inválido');
  const v=parseFloat(a[0]); const g=i=>parseInt(a[i])||0;
  const c={name:a[1]||'Mutant Clone',scale:parseFloat(a[2])||100,idx:{}};
  c.idx.Hats=g(3); c.idx.Hair=g(4); c.idx.Body=g(5)+(v<3.23?1:0); c.idx.Arms=g(6)+(v<3.2?1:0); c.idx.Shoes=g(7)+(v<3.2?1:0);
  c.idx.Eyes=g(8); c.idx.Mouth=g(9); c.idx.Items=g(10); c.idx.Acc=g(11); c.idx.Back=g(12);
  for(const [cat] of CATS){ const n=D.parts[cat].length; if(c.idx[cat]<0||c.idx[cat]>=n) c.idx[cat]=0; }
  c.color=(v<3.23||!a[13])?D.parts.Hair[c.idx.Hair][6]:a[13].replace(/[^0-9a-f]/gi,'').padEnd(6,'0').slice(0,6);
  return c;
}

/* ---------- UI ---------- */
function syncUI(){
  const c=sel, isChar=c&&c.kind==='char';
  $('#tChar').style.opacity=isChar?1:.45;
  if(isChar){ $('#iName').value=c.name; $('#cHair').value='#'+c.color.slice(0,6).padEnd(6,'0'); $('#dna').value=getDNA(c); $('#sPreset').value=D.presets[c.name]?c.name:''; }
  $('#kLock').checked=!!locks[curCat];
  document.querySelectorAll('#grid .th').forEach(t=>t.classList.toggle('cur',isChar&&+t.dataset.i===c.idx[curCat]));
  $('#info').textContent=c?`${c.kind==='char'?'Personaje':'Objeto'}: ${c.name}`:'Nada seleccionado';
}
function tabs(box,items,cur,fn){ box.innerHTML=''; items.forEach(([k,l])=>{ const b=document.createElement('button'); b.textContent=l; b.className=k===cur?'on':''; b.onclick=()=>{ fn(k); [...box.children].forEach(x=>x.classList.toggle('on',x===b)); }; box.appendChild(b); }); }

const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); e.target._draw&&e.target._draw(); } }),{rootMargin:'200px'});
function thumb(box,libName,frame,i,label,onClick,opts={}){
  const d=document.createElement('div'); d.className='th'; d.dataset.i=i; d.title=label; d.onclick=onClick;
  d._draw=async()=>{
    await lib(libName); if(opts.extra) await Promise.all(opts.extra.map(lib));
    const s=document.createElementNS(NS,'svg'); d.appendChild(s);
    const g=el('g',{transform:'scale(0.05)'},s); if(opts.color) s.style.setProperty('--hair','#'+opts.color);
    const gg=el('g',{},g); cloneFrame(libName,frame,gg);
    if(opts.second) cloneFrame('Hair2',opts.second,el('g',{},g));
    if(opts.full){ g.setAttribute('transform','scale(0.05)'); }
    const bb=g.getBBox(); const p=Math.max(bb.width,bb.height)*.05;
    const w=bb.width||1,h=bb.height||1; s.setAttribute('viewBox',`${bb.x*.05-0} ${bb.y*.05-0} ${w*.05} ${h*.05}`);
    if(opts.vb) s.setAttribute('viewBox',opts.vb);
    s.setAttribute('preserveAspectRatio','xMidYMid meet');
    if(label){ const i2=document.createElement('i'); i2.textContent=label; d.appendChild(i2); }
  };
  box.appendChild(d); io.observe(d); return d;
}
function fillGrid(cat){
  const box=$('#grid'); box.innerHTML=''; const arr=D.parts[cat];
  arr.forEach((p,i)=>{
    const pick_=()=>{ if(!sel||sel.kind!=='char'){ return; } sel.idx[cat]=i; if(cat==='Hair') sel.color=D.parts.Hair[i][6]; refresh(sel).then(()=>{syncUI();save();}); sfx('MenuSelect'); };
    if(p==='none'){ const d=document.createElement('div'); d.className='th none'; d.dataset.i=i; d.textContent='ninguno'; d.onclick=pick_; box.appendChild(d); return; }
    const opts={};
    if(cat==='Hair'){ opts.color=p[6]; if(p[5]>0) opts.second=p[5]; opts.extra=['Hair2']; }
    thumb(box,cat,p[1],i,p[0],pick_,opts);
  });
  syncUI();
}
function setMain(k){
  ['tChar','tBg','tObj'].forEach(id=>$('#'+id).hidden=id!=='t'+k);
  if(k==='Bg'&&!$('#gridBg').children.length) fillBg();
  if(k==='Obj'&&!$('#gridObj').children.length) fillObj();
}
function fillBg(){
  const box=$('#gridBg'); D.bgs.forEach((b,i)=>{
    if(b==='none'){ const d=document.createElement('div'); d.className='th none'; d.textContent='ninguno'; d.onclick=()=>setBg(0); box.appendChild(d); return; }
    thumb(box,'BGs',b[1],i,b[0],()=>setBg(i),{vb:'0 0 550 400'});
  });
}
let curBg=0;
async function setBg(i){
  curBg=i; const g=$('#bg'); g.innerHTML=''; const b=D.bgs[i]; if(b==='none'){ save(); return; }
  await lib('BGs'); const inner=el('g',{transform:'scale(0.05)'},g); cloneFrame('BGs',b[1],inner); sfx('MenuSelect'); save();
}
function fillObj(){
  const box=$('#gridObj'); D.objects.forEach((o,i)=>thumb(box,'Objects',o[1],i,o[0],()=>addObj(o[1],o[0])));
}

/* ---------- PNG ---------- */
function exportPng(){
  const s=$('#stage').cloneNode(true); s.querySelectorAll('.selbox').forEach(n=>n.remove());
  const markup=s.outerHTML; const ids=new Set([...markup.matchAll(/url\(#([^)]+)\)/g)].map(m=>m[1]));
  const defs=s.querySelector('defs'); ids.forEach(id=>{ const n=defsEl.querySelector('[id="'+id+'"]'); if(n&&id!=='sclip') defs.appendChild(n.cloneNode(true)); });
  const st=document.createElementNS(NS,'style'); st.textContent='.hc{fill:var(--hair,#888)}.hs{stroke:var(--hair,#888)}'; s.prepend(st);
  s.setAttribute('width',1100); s.setAttribute('height',800);
  const rect=el('rect',{width:550,height:400,fill:'#fff'}); s.insertBefore(rect,s.querySelector('g'));
  const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(s)],{type:'image/svg+xml'}));
  const img=new Image(); img.onload=()=>{ const cv=document.createElement('canvas'); cv.width=1100; cv.height=800; cv.getContext('2d').drawImage(img,0,0); cv.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='walfas.png'; a.click(); }); URL.revokeObjectURL(url); };
  img.src=url;
}

/* ---------- guardado ---------- */
function save(){
  try{ localStorage.setItem('walfas-scene',JSON.stringify({bg:curBg,ents:ents.map(e=>e.kind==='char'?{k:'c',dna:getDNA(e),x:e.x,y:e.y,rot:e.rot,fx:e.fx,fy:e.fy,sc:e.scale}:{k:'o',frame:e.frame,name:e.name,x:e.x,y:e.y,rot:e.rot,fx:e.fx,fy:e.fy,sc:e.scale})})); }catch(e){}
}
async function load(){
  try{ const s=JSON.parse(localStorage.getItem('walfas-scene')||'null'); if(!s||!s.ents.length) return false;
    if(s.bg) await setBg(s.bg);
    for(const e of s.ents){ if(e.k==='c'){ const d=parseDNA(e.dna); await addChar({...d,x:e.x,y:e.y,rot:e.rot,fx:e.fx,fy:e.fy,scale:e.sc},false); } else { const c=mkEnt({kind:'obj',name:e.name,frame:e.frame,scale:e.sc,x:e.x,y:e.y,rot:e.rot,fx:e.fx,fy:e.fy}); await refresh(c); } }
    return true; }catch(e){ return false; }
}

/* ---------- init ---------- */
(async function(){
  D=await (await fetch('data.json')).json();
  tabs($('#mainTabs'),[['Char','Personaje'],['Bg','Fondo'],['Obj','Objetos']],'Char',setMain);
  tabs($('#catTabs'),CATS,curCat,k=>{curCat=k;fillGrid(k);});
  const sp=$('#sPreset'); sp.innerHTML='<option value="">— preset —</option>'+Object.keys(D.presets).sort().map(n=>`<option>${n}</option>`).join('');
  sp.onchange=()=>{ if(sel&&sel.kind==='char'&&sp.value){ applyPreset(sel,sp.value); refresh(sel).then(()=>{syncUI();save();}); sfx('PowerUpS'); } };
  $('#iName').oninput=e=>{ if(sel&&sel.kind==='char'){ sel.name=e.target.value; $('#dna').value=getDNA(sel); save(); } };
  $('#cHair').oninput=e=>{ if(sel&&sel.kind==='char'){ sel.color=e.target.value.slice(1); sel.g.style.setProperty('--hair',e.target.value); $('#dna').value=getDNA(sel); save(); } };
  $('#kLock').onchange=e=>{ locks[curCat]=e.target.checked; };
  $('#rScale').oninput=e=>{ if(sel){ sel.scale=+e.target.value; transformOnly(sel); } };
  $('#rRot').oninput=e=>{ if(sel){ sel.rot=+e.target.value; transformOnly(sel); } };
  $('#rScale').onchange=$('#rRot').onchange=save;
  $('#bNew').onclick=async()=>{ const c=await addChar({}); randomIdx(c); applyPreset(c,Object.keys(D.presets)[Math.floor(Math.random()*Object.keys(D.presets).length)]); c.x=150+Math.random()*250; await refresh(c); syncUI(); save(); sfx('PowerUpS'); };
  $('#bRand').onclick=()=>{ if(sel&&sel.kind==='char'){ randomIdx(sel); refresh(sel).then(()=>{syncUI();save();}); sfx('Whoosh'); } };
  $('#bClone').onclick=async()=>{ if(!sel) return; if(sel.kind==='char'){ const d=parseDNA(getDNA(sel)); await addChar({...d,x:sel.x+30,y:sel.y+10,rot:sel.rot,fx:sel.fx,fy:sel.fy,scale:sel.scale}); } else { await addObj(sel.frame,sel.name); sel.x+=0; } save(); };
  $('#bDel').onclick=del;
  $('#bFH').onclick=()=>{ if(sel){ sel.fx*=-1; transformOnly(sel); save(); } };
  $('#bFV').onclick=()=>{ if(sel){ sel.fy*=-1; transformOnly(sel); save(); } };
  $('#bFront').onclick=()=>{ if(sel){ $('#ents').appendChild(sel.g); ents=ents.filter(e=>e!==sel).concat(sel); save(); } };
  $('#bBack').onclick=()=>{ if(sel){ $('#ents').prepend(sel.g); ents=[sel].concat(ents.filter(e=>e!==sel)); save(); } };
  $('#bPng').onclick=exportPng;
  $('#bClear').onclick=()=>{ ents.forEach(e=>e.g.remove()); ents=[]; pick(null); save(); };
  $('#bDnaCopy').onclick=()=>{ $('#dna').select(); try{navigator.clipboard.writeText($('#dna').value);}catch(e){document.execCommand('copy');} $('#dnaMsg').textContent='Copiado'; };
  $('#bDnaLoad').onclick=async()=>{ try{ const d=parseDNA($('#dna').value); await addChar(d); $('#dnaMsg').textContent='Personaje creado'; save(); sfx('PowerUpS'); }catch(e){ $('#dnaMsg').textContent=e.message; } };
  $('#snd').onclick=e=>{ muted=!muted; e.target.textContent=muted?'🔇':'🔊'; };
  fillGrid(curCat);
  if(!(await load())){ const c=await addChar({}); applyPreset(c,'Reimu'); await refresh(c); syncUI(); }
  else pick(ents.find(e=>e.kind==='char')||null);
})();
</script>
</body>
</html>
